<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHMC Old Survival Archive</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0f1117;
            color:white;
            font-family:Arial,Helvetica,sans-serif;
        }

        header{
            padding:50px 20px;
            text-align:center;
            border-bottom:1px solid #222;
        }

        h1{
            font-size:42px;
            letter-spacing:2px;
        }

        .subtitle{
            color:#9ca3af;
            margin-top:10px;
        }

        .search{
            max-width:700px;
            margin:40px auto;
            padding:0 20px;
        }

        input{
            width:100%;
            padding:16px;
            border-radius:12px;
            border:none;
            background:#1b1f27;
            color:white;
            font-size:16px;
        }

        .grid{
            max-width:1200px;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:25px;
            padding:20px;
        }

        .card{
            background:#181b22;
            border-radius:16px;
            overflow:hidden;
            transition:.25s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .thumb{
            width:100%;
            height:200px;
            background:#242936;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:50px;
        }

        .info{
            padding:20px;
        }

        .type{
            color:#4ea1ff;
            font-size:14px;
        }

        footer{
            text-align:center;
            padding:60px 20px;
            color:#666;
        }
    </style>

</head>
<body>

<header>

<h1>ARCHMC OLD SURVIVAL ARCHIVE</h1>

<p class="subtitle">
Preserving memories, screenshots and videos.
</p>

</header>

<section class="search">

<input placeholder="Search archive...">

</section>

<section class="grid">

<div class="card">

<div class="thumb">
🖼️
</div>

<div class="info">

<div class="type">
IMAGE
</div>

<h2>Coming Soon</h2>

<p>
Upload your screenshots into the images folder.
</p>

</div>

</div>

<div class="card">

<div class="thumb">
🎥
</div>

<div class="info">

<div class="type">
VIDEO
</div>

<h2>Coming Soon</h2>

<p>
Upload your videos into the videos folder.
</p>

</div>

</div>

</section>

<footer>

ARCHMC Archive © 2026

</footer>

<script src="script.js"></script>

</body>
</html>
